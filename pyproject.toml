[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betatrend"
version = "0.1.0"
description = "ETHUSDT timing: decision net → long/short signal → OMS"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "httpx>=0.26",
  "pyarrow>=14",
  "loguru>=0.7",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
nn = ["torch>=2.2"]
explore = ["torchexplorer>=1.1.2"]
rust = ["maturin>=1.7"]

[tool.maturin]
manifest-path = "crates/betatrend-py/Cargo.toml"
module-name = "betatrend_env"

[project.scripts]
betatrend = "betatrend.cli:main"

[tool.setuptools.packages.find]
include = ["betatrend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
