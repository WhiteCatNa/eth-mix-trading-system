[package]
name = "betatrend-py"
version.workspace = true
edition.workspace = true
description = "PyO3 bindings for betatrend-env (module betatrend_env)"

[lib]
name = "betatrend_env"
crate-type = ["cdylib"]

[dependencies]
betatrend-env = { path = "../betatrend-env" }
pyo3 = { version = "0.23", features = ["extension-module"] }
serde_json = "1"
